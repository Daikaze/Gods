name: Validate Gods Codex
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ESModule syntax
        run: |
          node --check scripts/gods.js
          node --check data/deities.js
      - name: Validate manifest, portraits and deity data
        run: python3 tests/validate.py
